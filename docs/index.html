<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Monitor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#171a26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Monitor">
<style>
  :root {
    color-scheme: dark;
    --bg: #171a26;
    --titlebar: #12141d;
    --row-bg: #1c2032;
    --row-alt-bg: #20243a;
    --border: #2a2f45;
    --text: #e7e9f5;
    --text-dim: #8a8fa8;
    --accent: #8b6cf6;
    --track: #2a2f45;
    --red-on: #ff4d4f;
    --red-off: #5a2a2c;
    --green: #3ddc84;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .panel {
    width: 100%;
    max-width: 560px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .titlebar {
    background: var(--titlebar);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 14px;
  }
  .titlebar .dot { color: var(--accent); margin-right: 6px; }
  .header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    padding: 8px 14px 6px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .agents { grid-column: 1 / -1; margin-top: 6px; padding-left: 12px; border-left: 2px solid var(--border); font-size: 12px; color: var(--text-dim); }
  .agent { display: grid; grid-template-columns: 1fr auto 14px; gap: 10px; align-items: center; padding: 2px 0; }
  .agent .agent-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .agent-type { color: var(--accent, #8b6cf6); margin-right: 6px; }
  .agent .agent-lamp { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; }
  .agent .agent-lamp.working { background: #ff4d4f; animation: blink 1s steps(2, start) infinite; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    align-items: center;
    padding: 10px 14px;
    font-size: 14px;
  }
  .row:nth-child(odd) { background: var(--row-bg); }
  .row:nth-child(even) { background: var(--row-alt-bg); }
  .name { font-weight: 600; }
  /* 1行目: ランプ+セッション名(大きめ)。2行目: UUID以降のボタン。3行目: パス */
  .name-line { display: flex; align-items: center; gap: 8px; }
  .name-line .lamp { flex-shrink: 0; }
  .name-text { font-size: 17px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 0 22px; }
  .chips button { margin: 0 !important; }
  .row .cwd { margin-left: 22px; }
  .term-btn {
    font-weight: 400;
    font-size: 10px;
    color: var(--text-dim);
    margin-left: 4px;
    padding: 1px 6px;
    background: var(--track);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
  }
  .term-btn:hover { color: var(--text); border-color: var(--accent); }
  .cwd { display: block; font-size: 11px; color: var(--text-dim); font-weight: 400; margin-top: 2px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name { min-width: 0; overflow-wrap: anywhere; }
  .end-btn, .clear-btn {
    font-weight: 400; font-size: 10px; color: var(--text-dim); margin-left: 4px; padding: 1px 6px;
    background: var(--track); border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
  }
  .end-btn:hover { color: var(--text); border-color: var(--red-on); }
  .clear-btn:hover { color: var(--text); border-color: var(--accent); }
  .end-btn:disabled, .clear-btn:disabled { opacity: 0.6; cursor: default; }
  /* --- 実行中の操作(作成・終了)と信頼確認 --- */
  .jobs { border-bottom: 1px solid var(--border); }
  .job { padding: 8px 14px; font-size: 12px; background: var(--titlebar); border-top: 1px solid var(--border); }
  .job-head { display: flex; align-items: center; gap: 8px; }
  .job-head .job-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .job.error .job-text { color: var(--red-on); }
  .job.done .job-text { color: var(--green); }
  .job-head button { background: none; border: none; color: var(--text-dim); font-size: 14px; cursor: pointer; padding: 2px 6px; }
  .job pre {
    margin: 8px 0; padding: 8px; max-height: 40vh; overflow: auto; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; font-size: 11px; line-height: 1.4; white-space: pre-wrap;
  }
  .job-actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--track);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  /* --- ＋(フォルダからセッション作成)のシート --- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 10;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column;
    background: var(--row-bg); border: 1px solid var(--border); border-radius: 12px 12px 0 0; padding: 14px;
  }
  @media (min-width: 601px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: 12px; max-height: 80vh; } }
  .sheet h2 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 button { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
  .base-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .base-tabs button {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--track);
    color: var(--text-dim); font-size: 12px; cursor: pointer;
  }
  .base-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .folder-list { flex: 1 1 auto; min-height: 120px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  .folder-list button {
    display: block; width: 100%; text-align: left; padding: 10px 12px; border: none; border-bottom: 1px solid var(--border);
    background: none; color: var(--text); font-size: 13px; cursor: pointer; overflow-wrap: anywhere;
  }
  .folder-list button.selected { background: var(--accent); color: #fff; }
  .folder-list .running { color: var(--text-dim); font-size: 11px; margin-left: 6px; }
  .folder-list button.selected .running { color: #eee; }
  .sheet label { font-size: 12px; color: var(--text-dim); display: block; margin: 10px 0 4px; }
  .sheet input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 15px;
  }
  .sheet .msg { font-size: 12px; color: var(--text-dim); min-height: 1.4em; margin: 8px 0; overflow-wrap: anywhere; }
  .sheet .msg.error { color: var(--red-on); }
  .sheet .job-actions { flex-wrap: wrap; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; max-width: calc(100% - 32px);
    background: var(--titlebar); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  .toast.error { border-color: var(--red-on); }
  .icon-btn { font-size: 14px !important; padding: 2px 8px !important; }
  .icon-btn.on { color: var(--accent) !important; border-color: var(--accent) !important; }
  .bar-wrap { display: flex; align-items: center; gap: 8px; }
  .bar-track {
    flex: 1;
    height: 8px;
    background: var(--track);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .model { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .pct { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lamp {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--green);
  }
  .lamp.working {
    background: var(--red-on);
    animation: blink 1s steps(1, end) infinite;
  }
  @keyframes blink {
    0%, 49% { background: var(--red-on); }
    50%, 100% { background: var(--red-off); }
  }
  .conn-error {
    width: 100%;
    max-width: 560px;
    margin-bottom: 10px;
    color: #ff4d4d;
    font-weight: bold;
    font-size: 14px;
    text-align: center;
  }
  .conn-error[hidden] { display: none; }
  .empty {
    padding: 24px 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  /* プラン使用量(Claude Usageアプリと同じ表)。一覧(#rows)だけがスクロールし、ここは常に見える */
  .usage {
    display: grid;
    grid-template-columns: auto minmax(30px, 1fr) 44px 52px 64px 84px;
    column-gap: 8px;
    row-gap: 8px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .usage .uh { font-size: 10px; color: var(--text-dim); letter-spacing: 0.03em; text-align: center; white-space: nowrap; }
  .usage .uh.used { grid-column: span 2; }
  .usage .uerr { font-size: 10px; color: #ff4d4d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .usage .ulabel { font-weight: 600; color: var(--text-dim); white-space: nowrap; letter-spacing: 0.03em; }
  .usage .ulabel .short { display: none; }
  .usage .ubar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .usage .ubar > div { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .usage .upct { font-weight: 700; font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  .usage .uring { display: flex; justify-content: center; }
  .usage .uin { font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .usage .uat { color: var(--text-dim); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 480px) {
    .usage .ulabel .long { display: none; }
    .usage .ulabel .short { display: inline; }
    .usage .uh.used .long { display: none; }
  }
  .titlebar button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    font-size: 12px;
    padding: 3px 8px;
    cursor: pointer;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .titlebar button:hover { color: var(--text); border-color: var(--accent); }
  .titlebar-actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hello { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); cursor: default; }
  .hello.status-success { color: var(--green); }
  .hello.status-error { color: var(--red-on); }
  .switch.mini { width: 30px; height: 16px; }
  .switch.mini .slider::before { width: 12px; height: 12px; left: 2px; top: 2px; }
  .switch.mini input:checked + .slider::before { transform: translateX(14px); }
  /* 一覧だけをスクロールさせる(タイトルバー・使用量・見出し・非表示トレイは固定) */
  .panel { display: flex; flex-direction: column; }
  .panel > * { flex-shrink: 0; }
  .panel > #rows { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  /* 初回にウィンドウを内容へ合わせた後(size-locked)だけ高さを画面に収め、はみ出す分を一覧内でスクロールする */
  body.size-locked { height: 100vh; height: 100dvh; }
  body.size-locked #app { min-height: 0; }

  .switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--track);
    border-radius: 26px;
    transition: background 0.2s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    top: 3px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: #fff; }
  .switch input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

  /* --- 接続先設定フォーム --- */
  .setup-panel {
    width: 100%;
    max-width: 420px;
    background: var(--row-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .setup-panel h1 { font-size: 16px; margin: 0 0 6px; }
  .setup-panel p { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin: 0 0 14px; }
  .setup-panel input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 10px;
  }
  .setup-panel button {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  /* --- スマホ幅: コンテキスト列を名前の下に回し、タップしやすい大きさにする --- */
  @media (max-width: 600px) {
    body { padding: 8px; }
    .panel { border-radius: 8px; }
    .titlebar { padding: 8px 10px; }
    .titlebar .title-text { display: none; }
    .titlebar-actions { gap: 6px; width: 100%; justify-content: flex-end; }
    .titlebar .addr { display: none; }
    .header { display: none; }
    .row { grid-template-columns: minmax(0, 1fr); row-gap: 6px; padding: 10px; }
    .row .bar-wrap { margin-left: 22px; }
    .usage { padding: 8px 10px; column-gap: 6px; grid-template-columns: auto minmax(20px, 1fr) 40px 56px 70px; }
    .usage .uring, .usage .uh.el { display: none; }  /* 経過リングは幅が足りないので省く */
  }
  @media (pointer: coarse) {
    .term-btn, .clear-btn, .end-btn { font-size: 12px; padding: 5px 10px; margin-top: 4px; }
    .titlebar button { font-size: 13px; padding: 6px 10px; }
  }
  /* --- 表示切替タブ(セッション / RPA agent)。agentはサーバーで有効なときだけ出す --- */
  .view-tabs { display: flex; gap: 6px; padding: 8px 14px 0; }
  .view-tabs button {
    padding: 5px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--track);
    color: var(--text-dim); font-size: 12px; cursor: pointer;
  }
  .view-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel > #rpa-rows { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  .rpa-summary { padding: 8px 14px 6px; font-size: 12px; color: var(--text-dim); }
  .rpa-summary .rpa-err { color: var(--red-on); margin-left: 6px; }
  .rpa-row { padding: 10px 14px; font-size: 13px; border-left: 3px solid transparent; }
  .rpa-row:nth-child(odd) { background: var(--row-bg); }
  .rpa-row:nth-child(even) { background: var(--row-alt-bg); }
  .rpa-row.stale { border-left-color: var(--red-on); background: rgba(255, 77, 79, 0.12); }
  .rpa-head { display: flex; align-items: center; gap: 8px; }
  .rpa-lamp { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
  .rpa-lamp.idle { background: var(--green); }
  .rpa-lamp.busy { background: #ffb020; }
  .rpa-lamp.stale { background: var(--red-on); }
  .rpa-name { font-size: 16px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .rpa-pc { font-size: 11px; color: var(--text-dim); }
  .rpa-sub { margin: 2px 0 0 20px; color: var(--text-dim); font-size: 12px; }
  .rpa-row.stale .rpa-updated { color: var(--red-on); font-weight: 600; }
  .rpa-fields { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 1px; margin: 4px 0 0 20px; font-size: 12px; }
  .rpa-fields dt { color: var(--text-dim); }
  .rpa-fields dd { margin: 0; overflow-wrap: anywhere; }
  .setup-panel .error { color: var(--red-on); font-size: 12px; margin: -4px 0 10px; min-height: 1em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="setup" class="setup-panel">
    <h1>接続先を指定</h1>
    <p>
      Claude Code Monitor(Web版)が動いているサーバーのアドレスを入力してください。<br>
      例: <code>192.168.1.10:8765</code> / <code>localhost:8765</code>(SSHトンネル経由)<br>
      一度指定すれば、次回からはこの端末で自動的に接続します。
    </p>
    <input id="setup-input" type="text" placeholder="例: 192.168.1.10:8765" autocapitalize="off" autocorrect="off" spellcheck="false">
    <input id="setup-token" type="password" style="margin-top:8px" placeholder="アクセストークン" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="error" id="setup-error"></div>
    <button id="setup-submit" type="button">接続する</button>
  </div>

  <div id="app" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <div id="conn-error" class="conn-error" hidden>サーバーに接続できません(起動状態・アドレスを確認してください)</div>
    <div class="panel">
      <div class="titlebar">
        <span class="title-text"><span class="dot">&#9679;</span>Claude Code Monitor</span>
        <span class="titlebar-actions"><button id="create-open" class="icon-btn" type="button" title="フォルダからセッションを作成">＋</button><button id="notify-toggle" class="icon-btn" type="button" title="作業完了の通知(アプリを開いている間のみ)">&#128276;</button><span class="hello" id="hello" title="毎朝4時(JST) Hello送信">Hello<label class="switch mini"><input type="checkbox" id="kickoff-toggle" disabled><span class="slider"></span></label></span><button id="change-address" type="button">接続先<span class="addr">: <span id="current-address"></span> (変更)</span></button></span>
      </div>
      <div class="usage" id="usage"></div>
      <div class="jobs" id="jobs" hidden></div>
      <div class="view-tabs" id="view-tabs" hidden><button type="button" data-view="sessions" class="active">セッション</button><button type="button" data-view="agents">agent</button></div>
      <div class="rpa-summary" id="rpa-summary" hidden></div>
      <div id="rpa-rows" hidden></div>
      <div class="header" id="sessions-header">
        <span>SESSION</span><span class="h-context">CONTEXT USED</span>
      </div>
      <div id="rows"></div>
    </div>
  </div>

  <div id="create-sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-label="セッションを作成">
      <h2><span>フォルダからセッションを作成</span><button id="create-close" type="button" title="閉じる">&#10005;</button></h2>
      <div class="base-tabs" id="base-tabs"></div>
      <div class="folder-list" id="folder-list"></div>
      <label for="create-name">セッション名(半角英数字・「-」「_」)</label>
      <input id="create-name" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64">
      <div class="msg" id="create-msg"></div>
      <div class="job-actions" id="create-actions"><button class="btn primary" id="create-submit" type="button" disabled>作成</button></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

<script>
const STORAGE_KEY = 'claudeMonitorServerAddress';
const TOKEN_STORAGE_KEY = 'claudeMonitorToken';
const HIDDEN_STORAGE_KEY = 'claudeMonitorHiddenSessions';  // 廃止した非表示機能の保存キー(起動時に消すだけ)
const POLL_INTERVAL_MS = 1500;

const setupEl = document.getElementById('setup');
const setupInput = document.getElementById('setup-input');
const setupToken = document.getElementById('setup-token');
const setupError = document.getElementById('setup-error');
const setupSubmit = document.getElementById('setup-submit');
const appEl = document.getElementById('app');
const currentAddressEl = document.getElementById('current-address');
const changeAddressBtn = document.getElementById('change-address');
const rowsEl = document.getElementById('rows');

let baseUrl = null;

// /api/* はBearerトークン必須。トークンは端末ごとにlocalStorageへ保存する。
function loadToken() {
  try { return localStorage.getItem(TOKEN_STORAGE_KEY) || ''; } catch (e) { return ''; }
}
function apiFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), 'Authorization': 'Bearer ' + loadToken() },
  });
}
let pollTimer = null;

function normalizeAddress(raw) {
  let v = raw.trim();
  if (!v) return null;
  // スキーム省略時: 実運用サーバーはTLS(https)。HTTPSのPWAからhttpへは混在コンテンツで接続できないため、
  // SSHトンネル経由のlocalhost系だけhttp、それ以外はhttpsを既定にする。
  if (!/^https?:\/\//i.test(v)) v = (/^(localhost|127\.0\.0\.1)(:|$)/i.test(v) ? 'http://' : 'https://') + v;
  return v.replace(/\/+$/, '');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTokens(n) {
  if (n >= 1_000_000) return trimZero((n / 1_000_000).toFixed(1)) + 'm';
  if (n >= 1_000) return trimZero((n / 1_000).toFixed(1)) + 'k';
  return String(n);
}
function trimZero(s) { return s.endsWith('.0') ? s.slice(0, -2) : s; }

function showSetup(prefill) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (rpaTimer) { clearInterval(rpaTimer); rpaTimer = null; }
  appEl.hidden = true;
  setupEl.hidden = false;
  setupInput.value = prefill || '';
  setupToken.value = loadToken();
  setupError.textContent = '';
  setupInput.focus();
  lastFitHeight = 0;
  appSizeLocked = false; document.body.classList.remove('size-locked');
  fitWindowToContent();
}

async function tryConnect(address) {
  const url = normalizeAddress(address);
  if (!url) {
    setupError.textContent = 'アドレスを入力してください';
    return;
  }
  setupSubmit.disabled = true;
  setupError.textContent = '接続確認中...';
  try {
    const res = await fetch(url + '/api/sessions', {
      cache: 'no-store',
      headers: { 'Authorization': 'Bearer ' + setupToken.value.trim() },
    });
    if (res.status === 401) {
      setupError.textContent = 'アクセストークンが正しくありません';
      setupSubmit.disabled = false;
      return;
    }
    if (!res.ok) throw new Error('unexpected status ' + res.status);
    await res.json();
  } catch (e) {
    setupError.textContent = '接続できませんでした(アドレス・サーバー起動状態・SSHトンネルを確認してください)';
    setupSubmit.disabled = false;
    return;
  }
  localStorage.setItem(STORAGE_KEY, url);
  localStorage.setItem(TOKEN_STORAGE_KEY, setupToken.value.trim());
  setupSubmit.disabled = false;
  startApp(url);
}

setupInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryConnect(setupInput.value); });

// インストール済みPWA(standaloneウィンドウ)の場合のみ、コンテンツの実サイズに
// 合わせてウィンドウ自体をリサイズする。通常のブラウザタブでは何もしない
// (resizeToはタブウィンドウには効かないため、呼んでも無害・無効果)。
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}
let lastFitHeight = 0;
// 初回表示でウィンドウサイズを内容に合わせた後は、セッション数の増減などで
// 幅・高さが勝手に変化しないようロックする(startApp/showSetupで解除)。
let appSizeLocked = false;
function fitWindowToContent() {
  if (!isStandalone()) return;
  if (appSizeLocked) return;
  requestAnimationFrame(() => {
    const rect = document.body.getBoundingClientRect();
    const contentHeight = Math.ceil(rect.height);
    if (Math.abs(contentHeight - lastFitHeight) < 4) return; // 微差では動かさない
    lastFitHeight = contentHeight;
    const chromeWidth = window.outerWidth - window.innerWidth;
    const chromeHeight = window.outerHeight - window.innerHeight;
    try {
      window.resizeTo(
        Math.ceil(rect.width) + chromeWidth,
        contentHeight + chromeHeight
      );
    } catch (e) { /* ブラウザによっては拒否される。無視してよい */ }
  });
}

function renderAgents(s, limit) {

}

// 接続コマンド(`claude attach <id>` / `tmux attach -t <名>`)をクリップボードへコピーする。
// ブラウザからサーバー上の端末は直接開けないため、端末側で貼り付けて実行してもらう。
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}

// --- プラン使用量(5時間セッション枠・週の上限)。サーバーの /api/usage はAPIを5分以上おきに呼んでキャッシュする(ここは60秒ごとにキャッシュを読むだけ)。
// 残り時間・経過率は表示のたびに手元の時計で計算する。
const USAGE_POLL_MS = 60000;
const USAGE_ROWS = [
  ['session', 'CURRENT SESSION', 'SESSION', '#8b6cf6'],
  ['weekly', 'WEEKLY LIMIT', 'WEEKLY', '#4f8ff7'],
];
const RING_RADIUS = 8;
const usageEl = document.getElementById('usage');
let lastUsage = {};
let lastUsageFetch = 0;
function formatRemaining(sec) {
  const minutes = Math.max(Math.floor(sec / 60), 0);
  const days = Math.floor(minutes / 1440), hours = Math.floor((minutes % 1440) / 60), mins = minutes % 60;
  if (days) return `${days}d ${hours}h`;
  if (hours) return `${hours}h ${mins}m`;
  return `${mins}m`;
}
function ringSvg(frac, color) {
  const c = 2 * Math.PI * RING_RADIUS;
  const arc = frac > 0 ? `<circle cx="10" cy="10" r="${RING_RADIUS}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${(c * frac).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 10 10)"/>` : '';
  return `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="${RING_RADIUS}" fill="none" stroke="var(--track)" stroke-width="3"/>${arc}</svg>`;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function renderUsage() {
  const now = Date.now();
  let html = `<div class="uerr">${lastUsage.error ? escapeHtml(lastUsage.error) : ''}</div>`
    + '<div class="uh used"><span class="long">SESSION </span>USED</div><div class="uh el">ELAPSED</div>'
    + '<div class="uh">RESETS IN</div><div class="uh">RESETS AT</div>';
  for (const [key, label, short, color] of USAGE_ROWS) {
    const item = lastUsage[key];
    html += `<div class="ulabel"><span class="long">${label}</span><span class="short">${short}</span></div>`;
    if (!item || typeof item.pct !== 'number') {
      html += `<div class="ubar"></div><div class="upct">—</div><div class="uring">${ringSvg(0, color)}</div><div class="uin">—</div><div class="uat">—</div>`;
      continue;
    }
    const resets = item.resets_at ? new Date(item.resets_at) : null;
    // リセット時刻を過ぎた枠は終了済み。APIが古い値を返す間も、経過100%・古い使用率のままにせず未使用として描く
    const expired = resets && !isNaN(resets.getTime()) && resets.getTime() <= now;
    const pct = expired ? 0 : Math.min(Math.max(item.pct, 0), 100);
    const valid = resets && !isNaN(resets.getTime()) && !expired;
    const remaining = valid ? (resets.getTime() - now) / 1000 : 0;
    const elapsed = valid && item.window_sec > 0 ? Math.min(Math.max(1 - remaining / item.window_sec, 0), 1) : 0;
    const at = !valid ? '—' : key === 'session'
      ? `${pad2(resets.getHours())}:${pad2(resets.getMinutes())}`
      : `${resets.getMonth() + 1}/${resets.getDate()} ${pad2(resets.getHours())}:${pad2(resets.getMinutes())}`;
    html += `<div class="ubar"><div style="width:${pct}%;background:${color}"></div></div>`
      + `<div class="upct">${Math.round(pct)}%</div><div class="uring">${ringSvg(elapsed, color)}</div>`
      + `<div class="uin">${valid && remaining > 0 ? formatRemaining(remaining) : '—'}</div><div class="uat">${at}</div>`;
  }
  usageEl.innerHTML = html;
}
async function refreshUsage(force) {
  if (!force && Date.now() - lastUsageFetch < USAGE_POLL_MS) { renderUsage(); return; }
  lastUsageFetch = Date.now();
  const keep = Object.fromEntries(Object.entries(lastUsage).filter(([k]) => k !== 'error'));
  try {
    const res = await apiFetch(baseUrl + '/api/usage', { cache: 'no-store' });
    const data = await res.json();
    // 取得に失敗しても前回値は消さず、エラー文言だけ差し替える
    lastUsage = (data.session || data.weekly) ? data : { ...keep, error: data.error || `HTTP ${res.status}` };
  } catch (e) {
    lastUsage = { ...keep, error: '使用量を取得できません' };
  }
  renderUsage();
}

const STATUS_LABELS = { success: '成功', error: 'エラー', skipped: 'スキップ' };

// ---------------------------------------------------------------------------
// 操作(＋作成・終了・信頼確認)。処理はサーバー側のジョブで動くので、アプリを閉じても止まらない。
// 開き直すと /api/jobs から実行中・直近の操作を取り直して表示する。
// ---------------------------------------------------------------------------
const SESSION_NAME_RE = /^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/;
const TMUX_ATTACH_RE = /^tmux attach -t =([A-Za-z0-9_-]{1,64})$/;
const DISMISSED_JOBS_KEY = 'claudeMonitorDismissedJobs';
const CREATE_BASE_KEY = 'claudeMonitorCreateBase';
const jobsEl = document.getElementById('jobs');
const toastEl = document.getElementById('toast');
let jobs = [];
let toastTimer = null;

function showToast(text, isError) {
  toastEl.textContent = text;
  toastEl.className = 'toast' + (isError ? ' error' : '');
  toastEl.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, isError ? 6000 : 3000);
}
function loadDismissedJobs() {
  try { const v = JSON.parse(localStorage.getItem(DISMISSED_JOBS_KEY) || '[]'); return new Set(Array.isArray(v) ? v : []); }
  catch (e) { return new Set(); }
}
const dismissedJobs = loadDismissedJobs();
function saveDismissedJobs() {
  // サーバーは完了後10分で操作を忘れるので、ここも直近の分だけ持てば足りる
  try { localStorage.setItem(DISMISSED_JOBS_KEY, JSON.stringify([...dismissedJobs].slice(-50))); } catch (e) { /* ignore */ }
}

// POSTしてJSONを返す。失敗はサーバーのエラー文言でthrowする。
async function apiPost(path, body) {
  let res;
  try {
    res = await apiFetch(baseUrl + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}),
    });
  } catch (e) {
    throw new Error('サーバーに接続できません');
  }
  let data = {};
  try { data = await res.json(); } catch (e) { data = {}; }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function activeJobFor(name) {
  return jobs.find(j => !j.done && j.name === name);
}
function renderActionButtons(s) {
  const m = TMUX_ATTACH_RE.exec(s.attach_cmd || '');
  if (!m) return '';  // クリア・終了はtmuxのセッションだけ(claude attach のbgは対象外)
  const busy = activeJobFor(m[1]);
  const id = escapeHtml(s.session_id);
  const dis = busy ? 'disabled' : '';
  const clearing = busy && busy.kind === 'clear';
  const ending = busy && busy.kind === 'end';
  return `<button type="button" class="clear-btn" data-id="${id}" ${dis}>${clearing ? 'クリア中…' : 'クリア'}</button>`
    + `<button type="button" class="end-btn" data-id="${id}" ${dis}>${ending ? '終了中…' : '終了'}</button>`;
}

// クリア: /session-end の完了後に /clear を送る(セッションは残す)
async function clearSession(sessionId) {
  const s = lastSessions.find(x => x.session_id === sessionId);
  if (!s) return;
  if (s.working) { showToast(`'${s.name}' は作業中です。待機中(緑)になってから押してください`, true); return; }
  if (s.context_tokens === 0) { showToast(`'${s.name}' はまだ会話が無いので、クリアする必要はありません`); return; }
  // 確認ダイアログは出さない(利用者の指示、2026-11-24)
  try {
    const data = await apiPost('/api/clear', { session_id: sessionId });
    upsertJob(data.job);
    showToast(`'${s.name}' のクリアを始めました`);
  } catch (e) {
    showToast(`クリアできません: ${e.message}`, true);
  }
}

async function endSession(sessionId) {
  const s = lastSessions.find(x => x.session_id === sessionId);
  if (!s) return;
  if (s.working) { showToast(`'${s.name}' は作業中です。待機中(緑)になってから押してください`, true); return; }
  // コンテキスト0(会話が無い)なら /session-end を送らず削除するだけなので、確認しない
  if (s.context_tokens !== 0 && !confirm(`'${s.name}' に /session-end を送り、完了したらセッションを削除します。\n(会話履歴は残ります。途中で質問が出たら端末で答えてください)\n\nよろしいですか?`)) return;
  try {
    const data = await apiPost('/api/end', { session_id: sessionId });
    upsertJob(data.job);
    showToast(`'${s.name}' の終了処理を始めました`);
  } catch (e) {
    showToast(`終了できません: ${e.message}`, true);
  }
}

function upsertJob(job) {
  const i = jobs.findIndex(j => j.id === job.id);
  if (i >= 0) jobs[i] = job; else jobs.push(job);
  renderJobs();
  renderRows(lastLimit, lastSessions);
}

const notifiedJobs = new Set();
async function refreshJobs() {
  if (!baseUrl) return;
  try {
    const res = await apiFetch(baseUrl + '/api/jobs', { cache: 'no-store' });
    if (!res.ok) return;  // 古いサーバー(このAPIが無い)では何もしない
    const data = await res.json();
    const before = new Map(jobs.map(j => [j.id, j]));
    jobs = Array.isArray(data.jobs) ? data.jobs : [];
    for (const j of jobs) {
      const prev = before.get(j.id);
      // 見ている間に状態が変わったものだけ通知する(開き直した直後の一覧で鳴らさない)
      if (prev && !prev.done && j.done && !notifiedJobs.has(j.id + ':done')) {
        notifiedJobs.add(j.id + ':done');
        notify(j.error ? `${j.name}: 失敗` : `${j.name}: 完了`, j.error || j.message, 'job-' + j.id);
      }
      if (prev && prev.stage !== 'trust' && j.stage === 'trust' && !notifiedJobs.has(j.id + ':trust')) {
        notifiedJobs.add(j.id + ':trust');
        notify(`${j.name}: 信頼確認の回答待ち`, 'アプリを開いて答えてください', 'job-' + j.id);
      }
    }
    renderJobs();
  } catch (e) { /* 接続エラーは一覧側で表示する */ }
}

function renderJobs() {
  const shown = jobs.filter(j => !dismissedJobs.has(j.id));
  jobsEl.hidden = shown.length === 0;
  jobsEl.innerHTML = shown.map(j => {
    const id = escapeHtml(j.id);
    const kind = { create: '作成', clear: 'クリア' }[j.kind] || '終了';
    const text = j.done ? (j.error ? `失敗: ${j.error}` : (j.message || '完了')) : `${j.stage_label}…`;
    let html = `<div class="job ${j.done ? (j.error ? 'error' : 'done') : ''}"><div class="job-head">`
      + `<span class="job-text"><b>${escapeHtml(j.name)}</b>(${kind}): ${escapeHtml(text)}</span>`
      + (j.done ? `<button type="button" class="job-dismiss" data-id="${id}" title="閉じる">&#10005;</button>` : '')
      + '</div>';
    if (j.stage === 'trust') {
      html += `<pre>${escapeHtml((j.trust_pane || []).join('\n'))}</pre>`
        + '<div class="job-actions">'
        + `<button type="button" class="btn primary trust-btn" data-id="${id}" data-approve="1">信頼する</button>`
        + `<button type="button" class="btn trust-btn" data-id="${id}" data-approve="0">やめる(削除)</button></div>`;
    }
    return html + '</div>';
  }).join('');
}

jobsEl.addEventListener('click', async (e) => {
  const dismiss = e.target.closest('.job-dismiss');
  if (dismiss) {
    dismissedJobs.add(dismiss.dataset.id);
    saveDismissedJobs();
    renderJobs();
    return;
  }
  const btn = e.target.closest('.trust-btn');
  if (!btn) return;
  const approve = btn.dataset.approve === '1';
  const job = jobs.find(j => j.id === btn.dataset.id);
  if (!approve && !confirm(`'${job ? job.name : ''}' を信頼せず、セッションを削除します。よろしいですか?`)) return;
  for (const b of jobsEl.querySelectorAll('.trust-btn')) b.disabled = true;
  try {
    const data = await apiPost(`/api/jobs/${encodeURIComponent(btn.dataset.id)}/trust`, { approve });
    upsertJob(data.job);
  } catch (err) {
    showToast(err.message, true);
    renderJobs();
  }
});

// --- ＋: フォルダを選んでセッションを作成 ---
const createSheet = document.getElementById('create-sheet');
const baseTabsEl = document.getElementById('base-tabs');
const folderListEl = document.getElementById('folder-list');
const createNameEl = document.getElementById('create-name');
const createMsgEl = document.getElementById('create-msg');
const createActionsEl = document.getElementById('create-actions');
let createBases = [];
let createBase = '';
let createFolders = null;   // null=取得中
let createFolder = null;    // 選択中(''=作成元フォルダ自体)
let createBusy = false;
let listSeq = 0;

function setCreateMsg(text, isError) {
  createMsgEl.textContent = text || '';
  createMsgEl.className = 'msg' + (isError ? ' error' : '');
}
function baseName(path) { return path.replace(/\/+$/, '').split('/').pop(); }
function folderPath(folder) { return folder === '' ? createBase : createBase + '/' + folder; }
function runningNames() { return new Set(lastSessions.map(s => s.name)); }

function createBlockedReason() {
  const name = createNameEl.value.trim();
  if (createFolder === null) return 'フォルダを選んでください';
  if (!name) return 'セッション名を入力してください(半角英数字・「-」「_」、先頭は英数字、64文字以内)';
  if (!SESSION_NAME_RE.test(name)) return 'セッション名に使えるのは半角英数字・「-」「_」のみです(先頭は英数字、64文字以内)';
  if (runningNames().has(name)) return `'${name}' という名前のセッションが既に起動しています`;
  return '';
}
function resetCreateActions() {
  createActionsEl.innerHTML = '<button class="btn primary" id="create-submit" type="button">作成</button>';
}
function refreshCreateState() {
  if (createBusy) return;
  const btn = document.getElementById('create-submit');
  const reason = createBlockedReason();
  if (btn) btn.disabled = !!reason;
  if (createFolders === null) return;
  setCreateMsg(reason || `場所: ${folderPath(createFolder)}`, !!reason && createFolder !== null);
}

function renderBaseTabs() {
  baseTabsEl.innerHTML = createBases.map(b =>
    `<button type="button" data-path="${escapeHtml(b.path)}" class="${b.path === createBase ? 'active' : ''}">${escapeHtml(b.label)}</button>`).join('');
}
function renderFolderList() {
  if (createFolders === null) { folderListEl.innerHTML = ''; return; }
  const running = runningNames();
  const items = ['', ...createFolders];
  folderListEl.innerHTML = items.map(f => {
    const label = f === '' ? `(このフォルダ自体: ${baseName(createBase)})` : f;
    const name = f === '' ? baseName(createBase) : f;
    return `<button type="button" data-folder="${escapeHtml(f)}" class="${f === createFolder ? 'selected' : ''}">${escapeHtml(label)}${running.has(name) ? '<span class="running">(起動中)</span>' : ''}</button>`;
  }).join('');
}

async function loadFolders() {
  const seq = ++listSeq;
  createFolders = null;
  createFolder = null;
  createNameEl.value = '';
  renderFolderList();
  resetCreateActions();
  refreshCreateState();
  setCreateMsg('フォルダ一覧を取得中...');
  try {
    const data = await apiPost('/api/create/listdir', { base: createBase });
    if (seq !== listSeq) return;
    createFolders = Array.isArray(data.folders) ? data.folders : [];
    renderFolderList();
    setCreateMsg('フォルダを選び、セッション名を確認して「作成」を押してください');
  } catch (e) {
    if (seq !== listSeq) return;
    createFolders = [];
    renderFolderList();
    setCreateMsg(e.message, true);
  }
}

async function openCreateSheet() {
  createSheet.hidden = false;
  createBusy = false;
  if (createBases.length === 0) {
    setCreateMsg('作成元を取得中...');
    try {
      const res = await apiFetch(baseUrl + '/api/create/bases', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status === 404 ? 'サーバーが古いため作成できません(サーバーを更新してください)' : `HTTP ${res.status}`);
      createBases = (await res.json()).bases || [];
    } catch (e) {
      setCreateMsg(e.message || 'サーバーに接続できません', true);
      return;
    }
  }
  let saved = '';
  try { saved = localStorage.getItem(CREATE_BASE_KEY) || ''; } catch (e) { /* ignore */ }
  createBase = createBases.some(b => b.path === saved) ? saved : (createBases[0] || {}).path || '';
  renderBaseTabs();
  loadFolders();
}
function closeCreateSheet() {
  createSheet.hidden = true;
  listSeq++;
}

baseTabsEl.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || createBusy || b.dataset.path === createBase) return;
  createBase = b.dataset.path;
  try { localStorage.setItem(CREATE_BASE_KEY, createBase); } catch (err) { /* ignore */ }
  renderBaseTabs();
  loadFolders();
});
folderListEl.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || createBusy) return;
  createFolder = b.dataset.folder;
  // セッション名の初期値はフォルダ名(名前に使えない文字なら空欄にして入力を促す)
  const def = baseName(folderPath(createFolder));
  createNameEl.value = SESSION_NAME_RE.test(def) ? def : '';
  resetCreateActions();
  renderFolderList();
  refreshCreateState();
  if (!createNameEl.value) createNameEl.focus();
});
createNameEl.addEventListener('input', () => { resetCreateActions(); refreshCreateState(); });
document.getElementById('create-close').addEventListener('click', closeCreateSheet);
createSheet.addEventListener('click', (e) => { if (e.target === createSheet) closeCreateSheet(); });
document.getElementById('create-open').addEventListener('click', openCreateSheet);

async function submitCreate(init) {
  const name = createNameEl.value.trim();
  createBusy = true;
  for (const b of createActionsEl.querySelectorAll('button')) b.disabled = true;
  setCreateMsg('作成を依頼中...');
  try {
    const data = await apiPost('/api/create', { base: createBase, folder: createFolder, name, init });
    upsertJob(data.job);
    closeCreateSheet();
    showToast(`'${name}' を作成中です(信頼確認が出たら一覧の上で答えてください)`);
  } catch (e) {
    createBusy = false;
    resetCreateActions();
    refreshCreateState();
    setCreateMsg(e.message, true);
  }
}

createActionsEl.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.id === 'create-submit') {
    if (createBlockedReason() || createBusy) return;
    createBusy = true;
    b.disabled = true;
    setCreateMsg('フォルダの中身を確認中...');
    let md = null;
    try {
      md = (await apiPost('/api/create/md_status', { base: createBase, folder: createFolder })).md;
    } catch (err) {
      createBusy = false;
      refreshCreateState();
      setCreateMsg(err.message, true);
      return;
    }
    createBusy = false;
    if (md && Object.values(md).some(Boolean)) { submitCreate(false); return; }
    // 引き継ぎmdが1つも無い: プロジェクトフォルダではない可能性(GUIと同じ3択)
    const names = md && Object.keys(md).length ? Object.keys(md).join('・') : '引き継ぎ用md';
    setCreateMsg(`'${baseName(folderPath(createFolder))}' には ${names} が1つもありません。プロジェクトフォルダではない可能性があります。`, true);
    createActionsEl.innerHTML = '<button class="btn primary" data-init="1" type="button">作成して /project-init</button>'
      + '<button class="btn" data-init="0" type="button">作成のみ</button>'
      + '<button class="btn" data-cancel="1" type="button">キャンセル</button>';
    return;
  }
  if (b.dataset.cancel) { resetCreateActions(); refreshCreateState(); return; }
  if (b.dataset.init) submitCreate(b.dataset.init === '1');
});

// --- 作業完了の通知(アプリを開いている間のみ。閉じている・画面が消えている間は届かない) ---
const NOTIFY_KEY = 'claudeMonitorNotify';
const IDLE_NOTIFY_SEC = 10;  // 待機中がこの秒数続いたら完了とみなす(サーバーの終了判定と同じ)
const notifyBtn = document.getElementById('notify-toggle');
const prevWorking = new Map();  // session_id -> 直前のworking
const idleSince = new Map();    // session_id -> 作業中→待機になった時刻(通知待ち)
function notifyEnabled() {
  try { return localStorage.getItem(NOTIFY_KEY) === '1' && 'Notification' in window && Notification.permission === 'granted'; }
  catch (e) { return false; }
}
function renderNotifyBtn() {
  const on = notifyEnabled();
  notifyBtn.classList.toggle('on', on);
  notifyBtn.title = on ? '作業完了の通知: オン(アプリを開いている間のみ)' : '作業完了の通知: オフ';
}
notifyBtn.addEventListener('click', async () => {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) { showToast('この端末では通知を使えません', true); return; }
  if (notifyEnabled()) {
    try { localStorage.setItem(NOTIFY_KEY, '0'); } catch (e) { /* ignore */ }
    renderNotifyBtn();
    showToast('通知をオフにしました');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { showToast('通知が許可されていません(端末の設定で許可してください)', true); return; }
  try { localStorage.setItem(NOTIFY_KEY, '1'); } catch (e) { /* ignore */ }
  renderNotifyBtn();
  showToast('通知をオンにしました(アプリを開いている間のみ届きます)');
});
async function notify(title, body, tag) {
  // 画面を見ている間は通知しない(ランプで分かるため)
  if (!notifyEnabled() || document.visibilityState === 'visible') return;
  try {
    const reg = await navigator.serviceWorker.ready;  // Androidは new Notification() が使えずSW経由が必須
    await reg.showNotification(title, { body: body || '', tag, icon: 'icon-192.png', badge: 'icon-192.png' });
  } catch (e) { /* ignore */ }
}
function checkFinishedWork(sessions) {
  const now = Date.now();
  const live = new Set();
  for (const s of sessions) {
    live.add(s.session_id);
    const was = prevWorking.get(s.session_id);
    if (s.working) idleSince.delete(s.session_id);
    else if (was === true) idleSince.set(s.session_id, now);  // 作業中→待機(初回の取得では鳴らさない)
    prevWorking.set(s.session_id, s.working);
    const t = idleSince.get(s.session_id);
    if (t !== undefined && !s.working && now - t >= IDLE_NOTIFY_SEC * 1000) {
      idleSince.delete(s.session_id);
      notify(`${s.name}: 作業が終わりました`, s.cwd, 'session-' + s.session_id);
    }
  }
  for (const id of [...prevWorking.keys()]) if (!live.has(id)) { prevWorking.delete(id); idleSince.delete(id); }
}
renderNotifyBtn();

// --- RPA実機エージェントの稼働一覧(「agent」タブ、読み取り専用)。サーバーが --rpa-agent-dir 付きで動いているときだけタブを出す。
// 窓タイトル・URLはサーバーが返さない(PHI対策。前面窓はクラス名だけ)。
const VIEW_STORAGE_KEY = 'claudeMonitorView';
const RPA_POLL_MS = 5000;  // RPA側のGUIと同じ間隔
const viewTabsEl = document.getElementById('view-tabs');
const rpaRowsEl = document.getElementById('rpa-rows');
const rpaSummaryEl = document.getElementById('rpa-summary');
const SESSION_VIEW_IDS = ['sessions-header', 'rows'];
// 欄: [キー, 見出し]。名前・PC・状態・最終更新は見出し行に出すので除く(列の並びはGUI版と同じ)
const RPA_FIELD_ORDER = [['hope', 'HOPE'], ['sender', '送信元'], ['lock', '占有'], ['command', '実行中'], ['hours', '使用時間'], ['foreground', '前面']];
let rpaEnabled = false;
let rpaTimer = null;
let currentView = 'sessions';
try { if (localStorage.getItem(VIEW_STORAGE_KEY) === 'agents') currentView = 'agents'; } catch (e) { /* ignore */ }

function isRpaView() { return rpaEnabled && currentView === 'agents'; }
function applyView() {
  const showAgents = isRpaView();
  viewTabsEl.hidden = !rpaEnabled;
  for (const b of viewTabsEl.querySelectorAll('button')) b.classList.toggle('active', b.dataset.view === (showAgents ? 'agents' : 'sessions'));
  for (const id of SESSION_VIEW_IDS) document.getElementById(id).hidden = showAgents;
  rpaRowsEl.hidden = !showAgents;
  rpaSummaryEl.hidden = !showAgents;
  if (showAgents && !rpaTimer) { refreshRpaAgents(); rpaTimer = setInterval(refreshRpaAgents, RPA_POLL_MS); }
  if (!showAgents && rpaTimer) { clearInterval(rpaTimer); rpaTimer = null; }
}
viewTabsEl.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-view]');
  if (!b) return;
  currentView = b.dataset.view;
  try { localStorage.setItem(VIEW_STORAGE_KEY, currentView); } catch (err) { /* ignore */ }
  applyView();
});

async function refreshRpaAgents() {
  let data;
  try {
    const res = await apiFetch(baseUrl + '/api/agents', { cache: 'no-store' });
    if (res.status === 404) { rpaEnabled = false; applyView(); return; }  // 古いサーバー
    data = await res.json();
  } catch (e) {
    if (!rpaSummaryEl.hidden) rpaSummaryEl.innerHTML = '<span class="rpa-err">agent一覧を取得できません</span>';
    return;
  }
  const enabled = !!(data && data.enabled);
  if (enabled !== rpaEnabled) { rpaEnabled = enabled; applyView(); }
  if (enabled && !rpaRowsEl.hidden) renderRpaAgents(data);
}

function renderRpaAgents(data) {
  const rows = Array.isArray(data.rows) ? data.rows : [];
  const alive = rows.filter(r => r.tag !== 'stopped').length;
  const stale = rows.filter(r => r.stale).length;
  const checked = data.checked_at ? String(data.checked_at).slice(11, 19) : '';
  rpaSummaryEl.innerHTML = `稼働 ${alive} / 全 ${rows.length} 台`
    + (stale ? ` ・ <span class="rpa-err" style="margin:0">更新停止 ${stale} 台</span>` : '')
    + (checked ? ` ・ ${escapeHtml(checked)} 時点` : '')
    + (data.error ? `<span class="rpa-err">${escapeHtml(data.error)}</span>` : '');
  if (!rows.length) { rpaRowsEl.innerHTML = '<div class="rpa-summary">エージェントがありません</div>'; return; }
  rpaRowsEl.innerHTML = rows.map(r => {
    const named = r.label && r.label !== '-';  // 名前が無いPCはPC名を名前の位置に出す
    const lamp = r.stale ? 'stale' : (r.tag === 'busy' ? 'busy' : (r.tag === 'idle' ? 'idle' : ''));
    const fields = RPA_FIELD_ORDER.filter(([k]) => r[k] && r[k] !== '-')
      .map(([k, t]) => `<dt>${t}</dt><dd>${escapeHtml(r[k])}</dd>`).join('');
    return `<div class="rpa-row${r.stale ? ' stale' : ''}">`
      + `<div class="rpa-head"><div class="rpa-lamp ${lamp}"></div><span class="rpa-name">${escapeHtml(named ? r.label : (r.pc || '-'))}</span>${named ? `<span class="rpa-pc">${escapeHtml(r.pc || '')}</span>` : ''}</div>`
      + `<div class="rpa-sub">${escapeHtml(r.state || '-')} ・ <span class="rpa-updated">${escapeHtml(r.updated || '-')}</span></div>`
      + (fields ? `<dl class="rpa-fields">${fields}</dl>` : '')
      + '</div>';
  }).join('');
}

function startApp(url) {
  baseUrl = url;
  currentAddressEl.textContent = url.replace(/^https?:\/\//, '');
  setupEl.hidden = true;
  appEl.hidden = false;
  lastFitHeight = 0;
  appSizeLocked = false; document.body.classList.remove('size-locked');
  lastUsage = {};
  Promise.all([refresh(), refreshKickoff(), refreshUsage(true)]).then(() => {
    // 初回表示のレイアウトが確定した後にサイズを固定する
    setTimeout(() => { appSizeLocked = true; document.body.classList.add('size-locked'); }, 300);
  });
  if (pollTimer) clearInterval(pollTimer);
  jobs = []; prevWorking.clear(); idleSince.clear();
  refreshJobs();
  pollTimer = setInterval(() => { refresh(); refreshKickoff(); refreshJobs(); }, POLL_INTERVAL_MS);
  rpaEnabled = false; applyView();
  refreshRpaAgents();  // 有効かどうか(タブを出すか)をサーバーに聞く
}

// タブ/ウィンドウが非表示の間はブラウザがsetIntervalを大幅に間引くため、
// 表示状態に戻ったタイミングで即座に再取得して古い表示のまま放置しない。
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && baseUrl) { refresh(); refreshKickoff(); refreshUsage(false); refreshJobs(); if (rpaTimer) refreshRpaAgents(); }
});

// 初期化: 保存済みアドレスがあれば自動接続、なければ入力フォームを表示
const saved = localStorage.getItem(STORAGE_KEY);
if (saved) {
  startApp(saved);
} else {
  showSetup('');
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
