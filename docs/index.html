<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Monitor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#171a26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Monitor">
<style>
  :root {
    color-scheme: dark;
    --bg: #171a26;
    --titlebar: #12141d;
    --row-bg: #1c2032;
    --row-alt-bg: #20243a;
    --border: #2a2f45;
    --text: #e7e9f5;
    --text-dim: #8a8fa8;
    --accent: #8b6cf6;
    --track: #2a2f45;
    --red-on: #ff4d4f;
    --red-off: #5a2a2c;
    --green: #3ddc84;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .panel {
    width: 100%;
    max-width: 560px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .titlebar {
    background: var(--titlebar);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 14px;
  }
  .titlebar .dot { color: var(--accent); margin-right: 6px; }
  .titlebar button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    font-size: 12px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .titlebar button:hover { color: var(--text); border-color: var(--accent); }
  .header {
    display: grid;
    grid-template-columns: 1fr 190px 60px;
    padding: 8px 14px 6px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 190px 60px;
    align-items: center;
    padding: 10px 14px;
    font-size: 14px;
  }
  .row:nth-child(odd) { background: var(--row-bg); }
  .row:nth-child(even) { background: var(--row-alt-bg); }
  .name { font-weight: 600; }
  .uuid-btn {
    font-weight: 400;
    font-size: 10px;
    color: var(--text-dim);
    font-family: "Consolas", "SFMono-Regular", monospace;
    margin-left: 8px;
    padding: 1px 6px;
    background: var(--track);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    user-select: all;
  }
  .uuid-btn:hover { color: var(--text); border-color: var(--accent); }
  .cwd { display: block; font-size: 11px; color: var(--text-dim); font-weight: 400; margin-top: 2px; }
  .bar-wrap { display: flex; align-items: center; gap: 8px; }
  .bar-track {
    flex: 1;
    height: 8px;
    background: var(--track);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .pct { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .status { display: flex; justify-content: flex-end; }
  .lamp {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--green);
  }
  .lamp.working {
    background: var(--red-on);
    animation: blink 1s steps(1, end) infinite;
  }
  @keyframes blink {
    0%, 49% { background: var(--red-on); }
    50%, 100% { background: var(--red-off); }
  }
  .empty {
    padding: 24px 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  .kickoff-panel {
    width: 100%;
    max-width: 560px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .kickoff-titlebar {
    background: var(--titlebar);
    padding: 10px 14px;
    font-weight: 600;
    font-size: 14px;
  }
  .kickoff-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    gap: 12px;
  }
  .kickoff-info { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .kickoff-info .status-success { color: var(--green); }
  .kickoff-info .status-error { color: var(--red-on); }
  .kickoff-info .status-skipped { color: var(--text-dim); }
  .switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--track);
    border-radius: 26px;
    transition: background 0.2s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    top: 3px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: #fff; }
  .switch input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

  /* --- 接続先設定フォーム --- */
  .setup-panel {
    width: 100%;
    max-width: 420px;
    background: var(--row-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .setup-panel h1 { font-size: 16px; margin: 0 0 6px; }
  .setup-panel p { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin: 0 0 14px; }
  .setup-panel input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 10px;
  }
  .setup-panel button {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .setup-panel .error { color: var(--red-on); font-size: 12px; margin: -4px 0 10px; min-height: 1em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="setup" class="setup-panel">
    <h1>接続先を指定</h1>
    <p>
      Claude Code Monitor(Web版)が動いているサーバーのアドレスを入力してください。<br>
      例: <code>192.168.1.10:8765</code> / <code>localhost:8765</code>(SSHトンネル経由)<br>
      一度指定すれば、次回からはこの端末で自動的に接続します。
    </p>
    <input id="setup-input" type="text" placeholder="例: 192.168.1.10:8765" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="error" id="setup-error"></div>
    <button id="setup-submit" type="button">接続する</button>
  </div>

  <div id="app" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <div class="kickoff-panel">
      <div class="kickoff-titlebar">毎朝4時(JST) Hello送信</div>
      <div class="kickoff-body">
        <div class="kickoff-info" id="kickoff-info">読み込み中...</div>
        <label class="switch">
          <input type="checkbox" id="kickoff-toggle" disabled>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="panel">
      <div class="titlebar">
        <span><span class="dot">&#9679;</span>Claude Code Monitor</span>
        <button id="change-address" type="button">接続先: <span id="current-address"></span> (変更)</button>
      </div>
      <div class="header">
        <span>SESSION</span><span>CONTEXT USED</span><span style="text-align:right">STATUS</span>
      </div>
      <div id="rows"></div>
    </div>
  </div>

<script>
const STORAGE_KEY = 'claudeMonitorServerAddress';
const POLL_INTERVAL_MS = 1500;

const setupEl = document.getElementById('setup');
const setupInput = document.getElementById('setup-input');
const setupError = document.getElementById('setup-error');
const setupSubmit = document.getElementById('setup-submit');
const appEl = document.getElementById('app');
const currentAddressEl = document.getElementById('current-address');
const changeAddressBtn = document.getElementById('change-address');
const rowsEl = document.getElementById('rows');

let baseUrl = null;
let pollTimer = null;

function normalizeAddress(raw) {
  let v = raw.trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
  return v.replace(/\/+$/, '');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTokens(n) {
  if (n >= 1_000_000) return trimZero((n / 1_000_000).toFixed(1)) + 'm';
  if (n >= 1_000) return trimZero((n / 1_000).toFixed(1)) + 'k';
  return String(n);
}
function trimZero(s) { return s.endsWith('.0') ? s.slice(0, -2) : s; }

function showSetup(prefill) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  appEl.hidden = true;
  setupEl.hidden = false;
  setupInput.value = prefill || '';
  setupError.textContent = '';
  setupInput.focus();
  lastFitHeight = 0;
  appSizeLocked = false;
  fitWindowToContent();
}

async function tryConnect(address) {
  const url = normalizeAddress(address);
  if (!url) {
    setupError.textContent = 'アドレスを入力してください';
    return;
  }
  setupSubmit.disabled = true;
  setupError.textContent = '接続確認中...';
  try {
    const res = await fetch(url + '/api/sessions', { cache: 'no-store' });
    if (!res.ok) throw new Error('unexpected status ' + res.status);
    await res.json();
  } catch (e) {
    setupError.textContent = '接続できませんでした(アドレス・サーバー起動状態・SSHトンネルを確認してください)';
    setupSubmit.disabled = false;
    return;
  }
  localStorage.setItem(STORAGE_KEY, url);
  setupSubmit.disabled = false;
  startApp(url);
}

setupSubmit.addEventListener('click', () => tryConnect(setupInput.value));
setupInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryConnect(setupInput.value); });
changeAddressBtn.addEventListener('click', () => {
  const saved = localStorage.getItem(STORAGE_KEY) || '';
  showSetup(saved.replace(/^https?:\/\//, ''));
});

const revealedUuids = new Set();
let lastLimit = 0;
let lastSessions = [];

// インストール済みPWA(standaloneウィンドウ)の場合のみ、コンテンツの実サイズに
// 合わせてウィンドウ自体をリサイズする。通常のブラウザタブでは何もしない
// (resizeToはタブウィンドウには効かないため、呼んでも無害・無効果)。
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}
let lastFitHeight = 0;
// 初回表示でウィンドウサイズを内容に合わせた後は、セッション数の増減などで
// 幅・高さが勝手に変化しないようロックする(startApp/showSetupで解除)。
let appSizeLocked = false;
function fitWindowToContent() {
  if (!isStandalone()) return;
  if (appSizeLocked) return;
  requestAnimationFrame(() => {
    const rect = document.body.getBoundingClientRect();
    const contentHeight = Math.ceil(rect.height);
    if (Math.abs(contentHeight - lastFitHeight) < 4) return; // 微差では動かさない
    lastFitHeight = contentHeight;
    const chromeWidth = window.outerWidth - window.innerWidth;
    const chromeHeight = window.outerHeight - window.innerHeight;
    try {
      window.resizeTo(
        Math.ceil(rect.width) + chromeWidth,
        contentHeight + chromeHeight
      );
    } catch (e) { /* ブラウザによっては拒否される。無視してよい */ }
  });
}

function renderRows(limit, sessions) {
  if (sessions.length === 0) {
    rowsEl.innerHTML = '<div class="empty">アクティブなセッションはありません</div>';
    fitWindowToContent();
    return;
  }
  rowsEl.innerHTML = sessions.map(s => {
    const id = escapeHtml(s.session_id);
    const uuidLabel = revealedUuids.has(s.session_id) ? id : 'UUID';
    return `
      <div class="row">
        <div class="name">${escapeHtml(s.name)}<button type="button" class="uuid-btn" data-id="${id}">${uuidLabel}</button><span class="cwd">${escapeHtml(s.cwd)}</span></div>
        <div class="bar-wrap">
          <div class="bar-track"><div class="bar-fill" style="width:${s.context_pct}%"></div></div>
          <div class="pct">${Math.round(s.context_pct)}% (${formatTokens(s.context_tokens)}/${formatTokens(limit)})</div>
        </div>
        <div class="status"><div class="lamp ${s.working ? 'working' : ''}"></div></div>
      </div>
    `;
  }).join('');
  fitWindowToContent();
}

rowsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.uuid-btn');
  if (!btn) return;
  const id = btn.dataset.id;
  if (revealedUuids.has(id)) revealedUuids.delete(id); else revealedUuids.add(id);
  renderRows(lastLimit, lastSessions);
});

async function refresh() {
  try {
    const res = await fetch(baseUrl + '/api/sessions', { cache: 'no-store' });
    if (!res.ok) throw new Error('offline');
    const data = await res.json();
    lastLimit = data.context_limit;
    lastSessions = data.sessions;
    renderRows(lastLimit, lastSessions);
  } catch (e) {
    rowsEl.innerHTML = '<div class="empty">サーバーに接続できません(起動状態・アドレスを確認してください)</div>';
    fitWindowToContent();
  }
}

const STATUS_LABELS = { success: '成功', error: 'エラー', skipped: 'スキップ' };
const kickoffToggle = document.getElementById('kickoff-toggle');
const kickoffInfo = document.getElementById('kickoff-info');
let kickoffSyncing = false;

function formatLocal(iso) {
  if (!iso) return '(まだ実行なし)';
  return new Date(iso).toLocaleString('ja-JP');
}

function renderKickoff(state) {
  kickoffToggle.checked = !!state.enabled;
  kickoffToggle.disabled = false;
  const statusClass = state.last_status ? `status-${state.last_status}` : '';
  const statusLabel = state.last_status ? (STATUS_LABELS[state.last_status] || state.last_status) : '-';
  kickoffInfo.innerHTML = `
    状態: ${state.enabled ? '有効' : '無効'}<br>
    次回実行(予定): ${escapeHtml(state.next_run_local || '-')}<br>
    前回実行: ${formatLocal(state.last_run)} <span class="${statusClass}">${escapeHtml(statusLabel)}</span>
  `;
  fitWindowToContent();
}

async function refreshKickoff() {
  if (kickoffSyncing) return;
  try {
    const res = await fetch(baseUrl + '/api/kickoff', { cache: 'no-store' });
    if (!res.ok) throw new Error('kickoff status unavailable');
    renderKickoff(await res.json());
  } catch (e) {
    kickoffInfo.textContent = '状態を取得できません(daily_kickoff.py 未検出、またはサーバーに接続できません)';
  }
}

kickoffToggle.addEventListener('change', async () => {
  kickoffSyncing = true;
  const enabled = kickoffToggle.checked;
  kickoffToggle.disabled = true;
  try {
    const res = await fetch(baseUrl + '/api/kickoff/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled }),
    });
    if (!res.ok) throw new Error('toggle failed');
    renderKickoff(await res.json());
  } catch (e) {
    kickoffToggle.checked = !enabled;
    kickoffToggle.disabled = false;
  } finally {
    kickoffSyncing = false;
  }
});

function startApp(url) {
  baseUrl = url;
  currentAddressEl.textContent = url.replace(/^https?:\/\//, '');
  setupEl.hidden = true;
  appEl.hidden = false;
  lastFitHeight = 0;
  appSizeLocked = false;
  Promise.all([refresh(), refreshKickoff()]).then(() => {
    // 初回表示のレイアウトが確定した後にサイズを固定する
    setTimeout(() => { appSizeLocked = true; }, 300);
  });
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { refresh(); refreshKickoff(); }, POLL_INTERVAL_MS);
}

// タブ/ウィンドウが非表示の間はブラウザがsetIntervalを大幅に間引くため、
// 表示状態に戻ったタイミングで即座に再取得して古い表示のまま放置しない。
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && baseUrl) { refresh(); refreshKickoff(); }
});

// 初期化: 保存済みアドレスがあれば自動接続、なければ入力フォームを表示
const saved = localStorage.getItem(STORAGE_KEY);
if (saved) {
  startApp(saved);
} else {
  showSetup('');
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
